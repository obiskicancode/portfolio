services:
  portfolio:
    build:
      context: .
      args:
        - NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        - NEXT_PUBLIC_CONTACT_ADDRESS: ${NEXT_PUBLIC_CONTACT_ADDRESS}
        - NEXT_PUBLIC_MAILING_ADDRESS: ${NEXT_PUBLIC_MAILING_ADDRESS}
        - NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: portfolio
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  proxy:
    external: true
