<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0f"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer glow -->
  <circle cx="28" cy="30" r="16" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.15"/>

  <!-- "O" letterform — bold geometric ring -->
  <circle cx="28" cy="30" r="13" fill="none" stroke="url(#ring)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Emerald dot accent (the "." in "Obiski.") -->
  <circle cx="48" cy="46" r="5" fill="url(#dot)"/>

  <!-- Subtle inner highlight on the dot -->
  <circle cx="46.5" cy="44.5" r="1.5" fill="#a7f3d0" opacity="0.5"/>
</svg>
